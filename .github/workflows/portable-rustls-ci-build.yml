name: portable-rustls CI

permissions:
  contents: read

on:
  push:
    branches-ignore:
    - 'gh-readonly-queue/**'
    tags:
    - '**'
  pull_request:
  merge_group:
  schedule:
    - cron: '0 18 * * *'

env:
  # NOTE: `portable-rustls` fork name is REPEATED here - TODO avoid repeating if possible
  ALL_FEATURES_EXCEPT_UNSAFE: $(admin/all-features-except unsafe-assume-single-core portable-rustls)
  MAIN_CRATE: portable-rustls

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build with unstable_portable_atomic_arc
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        rust:
          - nightly
          - nightly-2024-01-01
          # RUST NIGHTLY version(s) for MSRV - 1.71:
          - nightly-2023-06-01
          # FAILS AT: cargo add once_cell
          # - nightly-2023-05-01
        os:
          - ubuntu-latest
          # FOR FUTURE CONSIDERATION:
          # - macos-latest
          # - windows-latest
        target:
          # 32-BIT TARGET(S) WITH NO ATOMIC PTR:
          - riscv32imc-unknown-none-elf
          - thumbv6m-none-eabi
          # 64-bit target(s) with no std crate - for comparison:
          - aarch64-unknown-none
          - x86_64-unknown-none
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install ${{ matrix.rust }} toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
          target: ${{ matrix.target }}

      - name: cargo build (debug; no-std; critical-section) # (with no built-in provider)
        run: cargo build -F critical-section --target ${{ matrix.target }}
        working-directory: rustls
        env:
          RUSTFLAGS: --cfg portable_atomic_unstable_coerce_unsized --cfg unstable_portable_atomic_arc

      - name: cargo build (debug; no-std; unsafe-assume-single-core) # (with no built-in provider)
        # TODO: UPDATE to match in case of any more target(s) are added with no atomic ptr
        if: startsWith(matrix.target, 'riscv') || startsWith(matrix.target, 'thumbv6')
        run: cargo build -F unsafe-assume-single-core --target ${{ matrix.target }}
        working-directory: rustls
        env:
          RUSTFLAGS: --cfg portable_atomic_unstable_coerce_unsized --cfg unstable_portable_atomic_arc

      # NOTE: BUILD with hashbrown FAILS with no atomic ptr - MISSING SUPPORT in default hasher
      # - name: cargo build (debug; no-std; hashbrown) # (with no built-in provider)
      #   ...

  test:
    # GENERAL NOTE: NO CI TESTING for no-std
    # (CI TESTING with no-std & with no atomic ptr FOR FUTURE CONSIDERATION)
    name: test with unstable_portable_atomic_arc
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        rust:
          - nightly
          - nightly-2024-05-01
          # FAILS cargo test: use of unstable library feature in proc-macro2
          # - nightly-2024-04-01
        os:
          - ubuntu-latest
          - macos-latest
          # FOR FUTURE CONSIDERATION:
          # - windows-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install ${{ matrix.rust }} toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}

      - name: cargo test (debug; std) # no built-in provider
        run: cargo test --features std
        working-directory: rustls
        env:
          RUSTFLAGS: --cfg portable_atomic_unstable_coerce_unsized --cfg unstable_portable_atomic_arc

      - name: cargo test (debug; unstable-std-extra [should cover all non-unsafe features])
        # USING `--all-targets` to avoid doc tests
        # TODO: FIX doc tests to work with --cfg unstable_portable_atomic_arc & enable doc tests here
        run: cargo test -F unstable-std-extra --all-targets
        working-directory: rustls
        env:
          RUSTFLAGS: --cfg portable_atomic_unstable_coerce_unsized --cfg unstable_portable_atomic_arc

      - name: cargo test (debug; all features except unsafe-assume-single-core)
        # USING `--all-targets` to avoid doc tests
        # TODO: FIX doc tests to work with --cfg unstable_portable_atomic_arc & enable doc tests here
        run: cargo test ${{ env.ALL_FEATURES_EXCEPT_UNSAFE }} --all-targets
        working-directory: rustls
        env:
          RUSTFLAGS: --cfg portable_atomic_unstable_coerce_unsized --cfg unstable_portable_atomic_arc

  cross-build:
    name: cross build test with unstable_portable_atomic_arc
    runs-on: ${{ matrix.os }}
    if: github.event_name != 'merge_group'
    strategy:
      matrix:
        rust:
          - nightly
          - nightly-2024-07-01
          # FAILS to install cross (cross-rs) from GitHub
          # - nightly-2024-06-01
        os:
          - ubuntu-latest
          # FOR FUTURE CONSIDERATION:
          # - macos-latest
          # - windows-latest
        target:
          # 32-bit Android (Linux) target(s) - for comparison:
          - armv7-linux-androideabi
          # 32-BIT TARGET(S) WITH NO ATOMIC PTR:
          - thumbv6m-none-eabi
          # additional target(s) - for comparison:
          # NOTE: This could have some overlap with 64-bit ARM-style CPU on macOS CI host;
          # may have similar ARM-style CPU overlap with standard Windows & possibly Linux in the future
          - aarch64-linux-android
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install ${{ matrix.rust }} toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
          target: ${{ matrix.target }}
      # TODO: improve performance installing cross-rs with caching - see recent RUSTLS update:
      # - https://github.com/rustls/rustls/pull/2343
      - name: Install cross (cross-rs) from GitHub
        run: cargo install cross --git https://github.com/cross-rs/cross
      - run: cross build --package ${{ env.MAIN_CRATE }} -F critical-section --target ${{ matrix.target }}
        env:
          RUSTFLAGS: --cfg portable_atomic_unstable_coerce_unsized --cfg unstable_portable_atomic_arc
      - run: cross build --package ${{ env.MAIN_CRATE }} -F unsafe-assume-single-core --target ${{ matrix.target }}
        # TODO: UPDATE to match in case of any more target(s) are added with no atomic ptr
        if: startsWith(matrix.target, 'thumbv6')
        env:
          RUSTFLAGS: --cfg portable_atomic_unstable_coerce_unsized --cfg unstable_portable_atomic_arc

  cross-test:
    # GENERAL NOTE: NO CI TESTING for no-std
    # (CI TESTING with no-std & with no atomic ptr FOR FUTURE CONSIDERATION)
    name: cross-target testing with unstable_portable_atomic_arc
    runs-on: ${{ matrix.os }}
    if: github.event_name != 'merge_group'
    # XXX TODO DO THIS THROUGHOUT CI IF THIS WORKS
    env:
      RUSTFLAGS: --cfg portable_atomic_unstable_coerce_unsized --cfg unstable_portable_atomic_arc
    strategy:
      matrix:
        rust:
          - nightly
          - nightly-2024-07-01
          # FAILS to install cross (cross-rs) from GitHub
          # - nightly-2024-06-01
        target:
          # 32-bit Android (Linux) targets:
          - armv7-linux-androideabi
          - i686-linux-android
          - thumbv7neon-linux-androideabi
          # additional target(s):
          # NOTE: This could have some overlap with 64-bit ARM-style CPU on macOS CI host;
          # may have similar ARM-style CPU overlap with standard Windows & possibly Linux in the future
          - aarch64-linux-android
        os:
          - ubuntu-latest
          # FOR FUTURE CONSIDERATION:
          # ...
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install ${{ matrix.rust }} toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
          target: ${{ matrix.target }}
      # TODO: improve performance installing cross-rs with caching - see recent RUSTLS update:
      # - https://github.com/rustls/rustls/pull/2343
      - name: Install cross (cross-rs) from GitHub
        run: cargo install cross --git https://github.com/cross-rs/cross
      - name: Install bindgen feature & CLI for aws-lc-sys (as needed for many cross targets)
        # TODO: improve performance installing bindgen with caching - see recent RUSTLS update:
        # - https://github.com/rustls/rustls/pull/2343
        run: cargo add --dev --features bindgen 'aws-lc-sys@>0.20' --package ${{ env.MAIN_CRATE }} --verbose && cargo install bindgen-cli --verbose
      - run: cross test --package ${{ env.MAIN_CRATE }} --target ${{ matrix.target }}
      - run: cross test -F unstable-std-extra --package ${{ env.MAIN_CRATE }} --target ${{ matrix.target }}
      - run: cross test ${{ env.ALL_FEATURES_EXCEPT_UNSAFE }} --package ${{ env.MAIN_CRATE }} --target ${{ matrix.target }}
