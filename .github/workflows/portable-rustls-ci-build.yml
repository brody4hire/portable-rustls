name: portable-rustls CI

permissions:
  contents: read

on:
  push:
    branches-ignore:
    - 'gh-readonly-queue/**'
    tags:
    - '**'
  pull_request:
  merge_group:
  schedule:
    - cron: '0 18 * * *'

env:
  MAIN_CRATE: portable-rustls

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build with unstable_portable_atomic_arc
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false # XXX XXX XXX
      matrix:
        rust:
          - nightly
          - nightly-2024-01-01
          # RUST NIGHTLY version(s) for MSRV - 1.71:
          - nightly-2023-06-01
          # FAILS AT: cargo add once_cell
          # - nightly-2023-05-01
        os:
          - ubuntu-latest
          # FOR FUTURE CONSIDERATION:
          # - macos-latest
          # - windows-latest
        target:
          # 32-BIT TARGET(S) WITH NO ATOMIC PTR:
          - riscv32imc-unknown-none-elf
          - thumbv6m-none-eabi
          # 64-bit target(s) with no std crate - for comparison:
          - aarch64-unknown-none
          - x86_64-unknown-none
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install ${{ matrix.rust }} toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
          target: ${{ matrix.target }}

      # TODO: CARGO FEATURE FOR THIS STEP
      - name: additional dependencies as needed for target(s) with no atomic ptr
        run: |
          cargo add once_cell -F portable-atomic -p ${{ env.MAIN_CRATE }}
          cargo add portable-atomic -F critical-section -p ${{ env.MAIN_CRATE }}

      - name: cargo build (debug; no-std) # (with no built-in provider)
        run: cargo build --target ${{ matrix.target }}
        working-directory: rustls
        env:
          RUSTFLAGS: --cfg portable_atomic_unstable_coerce_unsized --cfg unstable_portable_atomic_arc

      # NOTE: BUILD with hashbrown FAILS with no atomic ptr - MISSING SUPPORT in default hasher
      # - name: cargo build (debug; no-std; hashbrown) # (with no built-in provider)
      #   ...

  test:
    # GENERAL NOTE: NO CI TESTING for no-std
    # (CI TESTING with no-std & with no atomic ptr FOR FUTURE CONSIDERATION)
    name: test with unstable_portable_atomic_arc
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false # XXX XXX XXX
      matrix:
        rust:
          - nightly
          # TEST with ALL FEATURES back to:
          - nightly-2024-07-01
          # TEST with LIMITED FEATURES back to:
          - nightly-2024-05-01
          # FAILS cargo test: use of unstable library feature in proc-macro2
          # - nightly-2024-04-01
        os:
          - ubuntu-latest
          - macos-latest
          # FOR FUTURE CONSIDERATION:
          # - windows-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install ${{ matrix.rust }} toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}

      - name: cargo test (debug; std) # no built-in provider
        run: cargo test --features std
        working-directory: rustls
        env:
          RUSTFLAGS: --cfg portable_atomic_unstable_coerce_unsized --cfg unstable_portable_atomic_arc

      - name: cargo test (debug; all features)
        # QUICK WORKAROUND TO AVOID TEST ISSUE WITH RUST NIGHTLY FROM MAY 2024
        if: ${{ !startsWith(matrix.rust, 'nightly-2024-05') }}
        run: cargo test --all-features
        working-directory: rustls
        env:
          # AS NEEDED for default build (with default Arc alias to portable_atomic_util::Arc)
          RUSTFLAGS: --cfg portable_atomic_unstable_coerce_unsized

  cross-build:
    name: cross build test with unstable_portable_atomic_arc
    runs-on: ${{ matrix.os }}
    if: github.event_name != 'merge_group'
    strategy:
      matrix:
        rust:
          - nightly
          - nightly-2024-07-01
          # FAILS to install cross (cross-rs) from GitHub
          # - nightly-2024-06-01
        os:
          - ubuntu-latest
          # FOR FUTURE CONSIDERATION:
          # - macos-latest
          # - windows-latest
        target:
          # 32-bit Android (Linux) target(s) - for comparison:
          - armv7-linux-androideabi
          # 32-BIT TARGET(S) WITH NO ATOMIC PTR:
          - thumbv6m-none-eabi
          # additional target(s) - for comparison:
          # NOTE: This could have some overlap with 64-bit ARM-style CPU on macOS CI host;
          # may have similar ARM-style CPU overlap with standard Windows & possibly Linux in the future
          - aarch64-linux-android
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install ${{ matrix.rust }} toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
          target: ${{ matrix.target }}
      # TODO: improve performance installing cross-rs with caching - see recent RUSTLS update:
      # - https://github.com/rustls/rustls/pull/2343
      - name: Install cross (cross-rs) from GitHub
        run: cargo install cross --git https://github.com/cross-rs/cross
      # TODO: CARGO FEATURE FOR THIS STEP
      - name: additional dependencies as needed for target(s) with no atomic ptr
        run: |
          cargo add once_cell -F portable-atomic -p ${{ env.MAIN_CRATE }}
          cargo add portable-atomic -F critical-section -p ${{ env.MAIN_CRATE }}
      - run: cross build --package ${{ env.MAIN_CRATE }} --target ${{ matrix.target }}
        env:
          RUSTFLAGS: --cfg portable_atomic_unstable_coerce_unsized --cfg unstable_portable_atomic_arc

  cross-test:
    # GENERAL NOTE: NO CI TESTING for no-std
    # (CI TESTING with no-std & with no atomic ptr FOR FUTURE CONSIDERATION)
    name: cross-target testing with unstable_portable_atomic_arc
    runs-on: ${{ matrix.os }}
    if: github.event_name != 'merge_group'
    strategy:
      matrix:
        rust:
          - nightly
          - nightly-2024-07-01
          # FAILS to install cross (cross-rs) from GitHub
          # - nightly-2024-06-01
        target:
          # 32-bit Android (Linux) targets:
          - armv7-linux-androideabi
          - i686-linux-android
          - thumbv7neon-linux-androideabi
          # additional target(s):
          # NOTE: This could have some overlap with 64-bit ARM-style CPU on macOS CI host;
          # may have similar ARM-style CPU overlap with standard Windows & possibly Linux in the future
          - aarch64-linux-android
        os:
          - ubuntu-latest
          # FOR FUTURE CONSIDERATION:
          # ...
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install ${{ matrix.rust }} toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
          target: ${{ matrix.target }}
      # TODO: improve performance installing cross-rs with caching - see recent RUSTLS update:
      # - https://github.com/rustls/rustls/pull/2343
      - name: Install cross (cross-rs) from GitHub
        run: cargo install cross --git https://github.com/cross-rs/cross
      - name: Install bindgen feature & CLI for aws-lc-sys (as needed for many cross targets)
        # TODO: improve performance installing bindgen with caching - see recent RUSTLS update:
        # - https://github.com/rustls/rustls/pull/2343
        run: cargo add --dev --features bindgen 'aws-lc-sys@>0.20' --package ${{ env.MAIN_CRATE }} --verbose && cargo install bindgen-cli --verbose
      - run: cross test --package ${{ env.MAIN_CRATE }} --target ${{ matrix.target }}
        env:
          RUSTFLAGS: --cfg portable_atomic_unstable_coerce_unsized --cfg unstable_portable_atomic_arc
      - run: cross test --all-features --package ${{ env.MAIN_CRATE }} --target ${{ matrix.target }}
        env:
          RUSTFLAGS: --cfg portable_atomic_unstable_coerce_unsized --cfg unstable_portable_atomic_arc

  full-build:
    # ensure everything builds together with this build cfg option enabled
    # (with help from exported `Arc` alias)
    name: full build with unstable_portable_atomic_arc cfg
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false # XXX XXX XXX
      matrix:
        rust:
          - nightly
          # try a few Rust nightly versions
          - nightly-2024-07-01
          - nightly-2024-01-01
          - nightly-2023-12-01
          # SEEMS TO PANIC
          # - nightly-2023-11-01
          # OK WITH NO FEATURES ENABLED (issue with --all-features due to `zlib`)
          - nightly-2023-10-01
          # KNOWN BUILD FAILURE
          # - nightly-2023-09-01
        os:
          - ubuntu-latest
          # FOR FUTURE CONSIDERATION:
          # - macos-latest
          # - windows-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install ${{ matrix.rust }} toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}

      - name: cargo build (debug; no-std) # (with no built-in provider)
        run: cargo build
        env:
          RUSTFLAGS: --cfg portable_atomic_unstable_coerce_unsized --cfg unstable_portable_atomic_arc

      - name: cargo build (debug; std; all features)
        # QUICK WORKAROUND TO AVOID BUILD ISSUE WITH RUST NIGHTLY FROM OCTOBER 2023
        if: ${{ !startsWith(matrix.rust, 'nightly-2023-10') }}
        run: cargo build --all-features
        env:
          RUSTFLAGS: --cfg portable_atomic_unstable_coerce_unsized --cfg unstable_portable_atomic_arc

  full-test:
    # test everything builds together with this build cfg option enabled
    # (with help from exported `Arc` alias)
    name: full test with unstable_portable_atomic_arc cfg
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false # XXX XXX XXX
      matrix:
        rust:
          - nightly
          - nightly-2024-07-01
          # TEST BUILD FAILURE WITH OLDER RUST NIGHTLY VERSIONS
          # - nightly-2024-06-01
          # ...
        os:
          - ubuntu-latest
          # FOR FUTURE CONSIDERATION:
          # - macos-latest
          # - windows-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install ${{ matrix.rust }} toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}

      - name: cargo test (debug; no-std) # (with no built-in provider)
        run: cargo test
        env:
          RUSTFLAGS: --cfg portable_atomic_unstable_coerce_unsized --cfg unstable_portable_atomic_arc

      - name: cargo test (debug; std; all features)
        run: cargo test --all-features
        env:
          RUSTFLAGS: --cfg portable_atomic_unstable_coerce_unsized --cfg unstable_portable_atomic_arc

      - name: cargo test (debug; rustls-provider-example; all features)
        run: cargo test --all-features -p rustls-provider-example
        env:
          RUSTFLAGS: --cfg portable_atomic_unstable_coerce_unsized --cfg unstable_portable_atomic_arc

      - name: cargo test (debug; rustls-provider-test; all features)
        run: cargo test --all-features -p rustls-provider-test
        env:
          RUSTFLAGS: --cfg portable_atomic_unstable_coerce_unsized --cfg unstable_portable_atomic_arc
