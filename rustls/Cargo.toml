[package]
name = "portable-rustls"
version = "0.0.2-dev"
edition = "2021"
rust-version = "1.71"
license = "Apache-2.0 OR ISC OR MIT"
readme = "../README.md"
description = "portable-rustls - a fork of rustls: a modern TLS library written in Rust."
homepage = "https://github.com/brody4hire/portable-rustls"
repository = "https://github.com/brody4hire/portable-rustls"
categories = ["network-programming", "cryptography"]
autobenches = false
autotests = false
exclude = ["src/testdata", "tests/**"]
build = "build.rs"

[features]
default = []

# XXX TODO UPDATE NOTE(S) HERE
# NOTE: This unstable & undocumented feature is intended to help make it easier to configure
# docs.rs to generate the documentation for all features where this is needed,
# excluding any potentially problematic features such as:
# - `unsafe-assume-single-core`
# - FIPS (if added back to this fork someday in the future)
#
# XXX TODO UPDATE NOTE(S) HERE
# IMPORTANT: KEEP THIS FEATURE NAME IN SYNC with the following:
# - [package.metadata.docs.rs] section further below
# - docs generate job configured in: .github/workflows/docs.yml
# XXX TODO RENAME
# XXX TBD UPDATE CI to use `--features unstable-...`  INSTEAD OF USING all-features-except - ??? ???
unstable-std-extra = [
  # XXX TODO RECONSIDER ORDERING
  "aws-lc-rs",
  "prefer-post-quantum", # (also covers "aws-lc-rs" until removed)
  "std",
  "ring",
  "logging",
  "brotli",
  "tls12",
  "zlib",
  "read_buf",
  "custom-provider",
]

# XXX TODO UPDATE NOTE(S) HERE
# IMPORTANT NODE: Any feature that affects documented API must be listed in `unstable-std-extra` above.
aws-lc-rs = ["aws_lc_rs"] # ALIAS - FAVORED OVER `aws_lc_rs` FEATURE NAME IN THIS FORK
aws_lc_rs = ["dep:aws-lc-rs", "webpki/aws_lc_rs"]
brotli = ["dep:brotli", "dep:brotli-decompressor", "std"]
custom-provider = []
# [FIPS REMOVED FROM THIS FORK] fips = ...
logging = ["log"]
prefer-post-quantum = ["aws-lc-rs"]
read_buf = ["rustversion", "std"]
ring = ["dep:ring", "webpki/ring"]
std = ["webpki/std", "pki-types/std", "once_cell/std"]
tls12 = []
zlib = ["dep:zlib-rs"]

# FEATURES FOR TARGETS WITH NO ATOMIC PTR - SEE DOCUMENTATION FOR MORE INFO
critical-section = ["dep:portable-atomic", "once_cell/critical-section", "portable-atomic/critical-section"]
unsafe-assume-single-core = ["once_cell/critical-section", "portable-atomic/unsafe-assume-single-core"]

[build-dependencies]
rustversion = { version = "1.0.6", optional = true }

[dependencies]
aws-lc-rs = { workspace = true, optional = true }
brotli = { workspace = true, optional = true }
brotli-decompressor = { workspace = true, optional = true }
hashbrown = { workspace = true, optional = true }
log = { workspace = true, optional = true }
# REQUIRED for no-std - RECENT VERSION NEEDED IN THIS FORK TO AVOID ANY
# POTENTIAL ISSUES WITH `critical-section` feature for no atomic ptr support
once_cell = { version = "1.20.3", default-features = false, features = ["alloc", "race"] }
# EXPLICIT `portable-atomic` dependency REQUIRED for `unsafe-assume-single-core` feature
portable-atomic = { version = "1.10.0", default-features = false, optional = true }
# TODO SHOULD BE OPTIONAL WITH FEATURE CONFIG IN THIS FORK
portable-atomic-util = { version = "0.2.4", features = ["alloc"] }
ring = { workspace = true, optional = true }
subtle = { workspace = true }
webpki = { workspace = true }
pki-types = { workspace = true }
zeroize = { workspace = true }
zlib-rs = { workspace = true, optional = true }

[dev-dependencies]
base64 = { workspace = true }
bencher = { workspace = true }
env_logger = { workspace = true }
hex = { workspace = true }
log = { workspace = true }
macro_rules_attribute = { workspace = true }
num-bigint = { workspace = true }
rcgen = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
time = { workspace = true }
webpki-roots = { workspace = true }
x509-parser = { workspace = true }

[[bench]]
name = "benchmarks"
path = "benches/benchmarks.rs"
harness = false
required-features = ["ring"]

[[example]]
name = "test_ca"
path = "examples/internal/test_ca.rs"

[[test]]
name = "api"
path = "tests/runners/api.rs"

[[test]]
name = "api_ffdhe"
path = "tests/runners/api_ffdhe.rs"
required-features = ["tls12"]

[[test]]
name = "bogo"
path = "tests/bogo.rs"

[[test]]
name = "client_cert_verifier"
path = "tests/runners/client_cert_verifier.rs"

[[test]]
name = "ech"
path = "tests/ech.rs"

[[test]]
name = "key_log_file_env"
path = "tests/runners/key_log_file_env.rs"

[[test]]
name = "process_provider"
path = "tests/process_provider.rs"

[[test]]
name = "server_cert_verifier"
path = "tests/runners/server_cert_verifier.rs"

[[test]]
name = "unbuffered"
path = "tests/runners/unbuffered.rs"

[package.metadata.docs.rs]
# Configure docs generated by docs.rs
# IMPORTANT: MUST KEEP IN SYNC AS FOLLOWS:
# - FEATURE NAME in sync with CORRESPONDING FEATURE NAME in main crate [features] section above
# - THIS cargo doc config IN SYNC with docs generate job in: .github/workflows/docs.yml
features = ["unstable-std-extra"]
rustdoc-args = ["--cfg", "docsrs"]

[package.metadata.cargo_check_external_types]
allowed_external_types = [
  # ---
  "rustls_pki_types",
  "rustls_pki_types::*",
]
